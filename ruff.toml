# Python: the Home Assistant integration, its tests and tools/. `ruff check .` runs in CI.
line-length = 120
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = [
  "E501",     # long lines are wrapped by hand where it helps reading
  "SIM105",   # try/except/pass reads clearer than contextlib.suppress around a yield
]

[lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true
