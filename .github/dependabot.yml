# Dependabot keeps dependencies up to date – quietly: once a month, one pull request per area with every minor and
# patch update in it. Major versions (a new .NET, Node, xunit …) are skipped: those are planned upgrades, done by
# hand. Security fixes still come straight away when "Dependabot security updates" is on in the repository settings.
#
# Commit prefixes follow release-please: "fix(deps)" for what ships (the image, the dashboard) – a patch release;
# "chore(deps)"/"chore(ci)" for tests and CI – no release.
version: 2
updates:
  # The bridge
  - package-ecosystem: nuget
    directory: /src/TeslaBridge
    schedule: { interval: monthly }
    commit-message: { prefix: "fix(deps)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      bridge:
        patterns: ["*"]

  # The .NET tests
  - package-ecosystem: nuget
    directory: /tests/TeslaBridge.Tests
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      tests:
        patterns: ["*"]

  # The dashboard (web/)
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    commit-message: { prefix: "fix(deps)", prefix-development: "chore(deps)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dashboard:
        patterns: ["*"]

  # Base images in the Dockerfile (.NET SDK/runtime, Node for the dashboard build) – patch/minor tags only
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "fix(deps)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]

  # Tesla's fleet-telemetry and vehicle-command in docker-compose.yml – pinned on purpose, reviewed here
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "fix(deps)" }
    groups:
      tesla:
        patterns: ["*"]

  # GitHub Actions and the Home Assistant test harness
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(ci)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /tests/ha
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
