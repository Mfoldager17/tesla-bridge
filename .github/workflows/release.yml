name: Release

# release-please keeps a "chore: release x.y.z" PR up to date from the commit messages (feat:, fix: …):
# version number, CHANGELOG.md, manifest.json and the project file. Merging that PR makes the release:
# tag vX.Y.Z, a GitHub Release (the bridge's update entity in HA shows it) and the images v1.2.0 / v1.2 / v1 / latest.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  checks:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/checks.yml

  image:
    needs: [release-please, checks]
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
