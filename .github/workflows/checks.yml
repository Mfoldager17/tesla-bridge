name: Checks

# The tests and builds every change must pass – used by build.yml (pushes and PRs) and release.yml (before a
# release image is built).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The bridge (.NET): formatting, analyzers (warnings are errors, see Directory.Build.props) and tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet format TeslaBridge.sln --verify-no-changes
      - run: dotnet test TeslaBridge.sln -c Release

  # Python (tools/) and the shell scripts
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff==0.16.9 check .
      - run: shellcheck -S warning install.sh

  # The dashboard (web/): types, unit tests and a production build
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
