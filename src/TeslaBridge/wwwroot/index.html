<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Tesla Bridge</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three/addons/" } }</script>
<style>
  :root {
    --bg: #0e1217; --surface: #161b22; --raise: #1f262f; --line: #2b333e; --line-soft: #212831;
    --text: #e8ecf1; --muted: #98a2b0; --faint: #687280;
    --accent: #5aa9ff; --accent-ink: #04101f;
    --charge: #3fcb8e; --warn: #f2a93b; --danger: #ff5d5d; --pending: #a78bfa; --heat: #ff8a4c; --cool: #5fc5ff;
    --body-off: #39424e; --body-fill: #1c222a;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.25);
    --glow: radial-gradient(1100px 520px at 75% -12%, rgba(90,169,255,.09), transparent 62%);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef1f5; --surface: #ffffff; --raise: #f2f4f7; --line: #dce1e8; --line-soft: #e8ecf1;
      --text: #161b22; --muted: #5d6775; --faint: #8b94a1;
      --accent: #2563eb; --accent-ink: #ffffff;
      --charge: #16a36a; --warn: #c27a0e; --danger: #d63b3b; --pending: #7c5ce0; --heat: #e8672a; --cool: #1f8ad8;
      --body-off: #c3c9d2; --body-fill: #f3f5f8;
      --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
      --glow: radial-gradient(1100px 520px at 75% -12%, rgba(37,99,235,.07), transparent 62%);
    }
  }
  :root[data-theme="light"] {
    --bg: #eef1f5; --surface: #ffffff; --raise: #f2f4f7; --line: #dce1e8; --line-soft: #e8ecf1;
    --text: #161b22; --muted: #5d6775; --faint: #8b94a1;
    --accent: #2563eb; --accent-ink: #ffffff;
    --charge: #16a36a; --warn: #c27a0e; --danger: #d63b3b; --pending: #7c5ce0; --heat: #e8672a; --cool: #1f8ad8;
    --body-off: #c3c9d2; --body-fill: #f3f5f8;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --glow: radial-gradient(1100px 520px at 75% -12%, rgba(37,99,235,.07), transparent 62%);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--glow), var(--bg); background-attachment: fixed; color: var(--text); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .shell > div { min-width: 0; }
  nav.side { position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 18px; }
  .brand { padding: 0 10px; }
  .brand b { display: block; font-size: 16px; letter-spacing: -.01em; }
  .brand span { color: var(--muted); font-size: 13px; }
  .brand select { margin-top: 8px; width: 100%; }
  .navlist { display: grid; gap: 2px; }
  .navlist a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); color: var(--muted); text-decoration: none; font-size: 14px; }
  .navlist a:hover { color: var(--text); background: var(--surface); }
  .navlist a[aria-current="page"] { color: var(--text); background: var(--raise); }
  .navlist svg { width: 18px; height: 18px; flex: none; }
  .navlist .count { margin-left: auto; font-size: 11px; padding: 0 6px; border-radius: 99px; background: var(--warn); color: #1b1305; }
  .conn { margin-top: auto; display: grid; gap: 6px; padding: 0 10px; font-size: 13px; color: var(--muted); }
  .conn div { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.ok { background: var(--charge); } .dot.bad { background: var(--danger); } .dot.warn { background: var(--warn); }
  .prefs { display: flex; gap: 6px; padding: 0 10px; }
  .prefs button { flex: 1; font-size: 12px; padding: 4px 6px; }

  main { padding: 28px 32px 120px; max-width: 1180px; width: 100%; }
  .view > h1 { font-size: 24px; font-weight: 600; letter-spacing: -.015em; margin: 0 0 4px; }
  .view > .lede { color: var(--muted); margin: 0 0 24px; max-width: 70ch; }

  .mobile-top { display: none; }
  @media (max-width: 860px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    nav.side { position: fixed; inset: auto 0 0 0; height: auto; z-index: 20; flex-direction: row; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      border-right: 0; border-top: 1px solid var(--line); background: var(--surface); }
    nav.side .brand, nav.side .conn, nav.side .prefs, nav.side .ver { display: none; }
    .navlist { grid-auto-flow: column; width: 100%; gap: 0; }
    .navlist a { flex-direction: column; gap: 2px; font-size: 10.5px; padding: 6px 0; justify-content: center; position: relative; min-width: 0; }
    .navlist a span:not(.count) { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .navlist .count { position: absolute; top: 2px; right: 18%; }
    .mobile-top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
    .mobile-top b { font-size: 15px; }
    .mobile-top .conn-mini { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
    main { padding: 20px 16px 110px; }
  }

  /* ---------- controls ---------- */
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--raise); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 13px; cursor: pointer; font-size: 14px; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
  button.danger { color: var(--danger); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover { color: var(--text); }
  select, input[type=number], input[type=text], input[type=password] { background: var(--raise); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 9px; font-size: 14px; }
  input[type=range] { accent-color: var(--accent); width: 100%; }

  .switch { position: relative; width: 42px; height: 24px; border-radius: 99px; background: var(--body-off); border: 0; padding: 0; flex: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }
  .switch.pending { background: var(--pending); }

  .seg { display: inline-flex; background: var(--raise); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; padding: 5px 11px; font-size: 13px; color: var(--muted); border-radius: 5px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .seg button.pending { color: var(--pending); box-shadow: 0 0 0 1px var(--pending); }

  .panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--shadow); }
  .panel + .panel { margin-top: 16px; }
  .ctl-grid .panel { margin-top: 0; }
  .panel h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .panel .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* ---------- overview ---------- */
  .hero { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 36px; align-items: center; padding: 8px 0 28px; }
  .hero.has3d { grid-template-columns: minmax(300px, 1.25fr) minmax(260px, 1fr); gap: 28px; }
  @media (max-width: 860px) { .hero, .hero.has3d { grid-template-columns: 1fr; gap: 18px; } }
  .car svg { width: 100%; height: auto; display: block; }
  .car .body { fill: var(--body-fill); stroke: var(--body-off); stroke-width: 2; }
  .car .wheel rect { fill: var(--body-off); }
  .car .part { fill: none; stroke: var(--body-off); stroke-width: 3; stroke-linecap: round; transition: stroke .3s; }
  .car .glass { fill: var(--raise); stroke: var(--body-off); stroke-width: 1.5; transition: fill .3s; }
  .car .open { stroke: var(--warn); }
  .car .glass.open { fill: color-mix(in srgb, var(--warn) 35%, transparent); stroke: var(--warn); }
  .car .port { fill: var(--body-off); transition: fill .3s; }
  .car .port.open { fill: var(--warn); } .car .port.plugged { fill: var(--charge); }
  .car .lock-badge circle { fill: var(--surface); stroke: var(--line); }
  .car .lock-badge path { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .car .lock-badge.unlocked path { stroke: var(--warn); }
  .car .lock-badge.pending path { stroke: var(--pending); }
  .c3d { position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: 380px; border-radius: var(--r-lg); overflow: hidden; }
  .c3d canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; outline: none; }
  .hs { position: absolute; left: 0; top: 0; z-index: 2; display: grid; place-items: center; width: 22px; height: 22px; padding: 0; border-radius: 50%;
    background: rgba(255,255,255,.22); border: 1.5px solid rgba(255,255,255,.8); box-shadow: 0 2px 8px rgba(0,0,0,.35); cursor: pointer; transition: opacity .3s, background .3s, box-shadow .3s; }
  .hs::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .hs span { position: absolute; left: 28px; top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 99px;
    background: rgba(13,17,23,.78); color: #fff; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .hs:hover span, .hs:focus-visible span, .hs.open span { opacity: 1; }
  .hs.open { background: var(--warn); border-color: #fff; box-shadow: 0 0 16px var(--warn); }
  .hs.port.open { background: var(--charge); box-shadow: 0 0 16px var(--charge); }
  .hs.port.charging { animation: blink 1.4s infinite; }
  .hs.door { opacity: 0; pointer-events: none; cursor: default; }
  .hs.door.open { opacity: 1; }
  .c3d .hs.hid, .c3d:not(.ready) .hs { opacity: 0 !important; pointer-events: none; }
  @keyframes blink { 50% { opacity: .45; } }
  .palbtn { position: absolute; right: 10px; top: 10px; z-index: 3; width: 36px; height: 36px; border-radius: 50%; padding: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 80%, transparent); }
  .palbtn svg { width: 18px; height: 18px; fill: currentColor; }
  .cpick { position: absolute; right: 10px; top: 54px; z-index: 3; display: grid; gap: 10px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
  .cpick .lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .sws { display: flex; gap: 8px; }
  .sw { width: 26px; height: 26px; border-radius: 50%; padding: 0; border: 2px solid var(--line); }
  .sw[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .c3d-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
  .c3d.ready .c3d-loading { display: none; }
  .car-legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .car-legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

  .battery .pct { font-size: 72px; font-weight: 250; letter-spacing: -.04em; line-height: 1; }
  .battery .pct small { font-size: 28px; font-weight: 300; color: var(--muted); margin-left: 2px; }
  .battery .range { font-size: 18px; color: var(--muted); margin: 6px 0 16px; }
  .battery .range b { color: var(--text); font-weight: 500; }
  .gauge { position: relative; height: 14px; border-radius: 7px; background: var(--raise); border: 1px solid var(--line); overflow: visible; }
  .gauge .fill { position: absolute; inset: 0 auto 0 0; border-radius: 7px; background: var(--muted); transition: width .6s ease; }
  .gauge .fill.charging { background: var(--charge); }
  .gauge .fill.low { background: var(--danger); }
  .gauge .limit { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--text); opacity: .7; border-radius: 1px; }
  .gauge-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); margin-top: 6px; }
  .charge-line { margin-top: 14px; font-size: 15px; }
  .charge-line .state { font-weight: 500; }
  .charge-line .state.on { color: var(--charge); }

  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 0 0 28px; }
  .facts div { padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line-soft); }
  .facts dt { color: var(--muted); font-size: 13px; }
  .facts dd { margin: 2px 0 0; font-size: 17px; }
  .facts dd.pending { color: var(--pending); }
  .facts dd .sub { display: block; color: var(--faint); font-size: 13px; }

  .log { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  .log li { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); align-items: baseline; }
  .log time { color: var(--faint); font-size: 13px; }
  .log .st { font-size: 13px; }
  .st.pending, .st.waking { color: var(--pending); } .st.succeeded { color: var(--charge); } .st.failed { color: var(--danger); }
  .log .err { grid-column: 2 / -1; color: var(--danger); font-size: 13px; margin-top: -4px; }
  .empty { color: var(--faint); padding: 18px 0; }

  /* ---------- car controls ---------- */
  .cgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .cgrid > .card { grid-column: span 6; }
  .cgrid > .card.climate { grid-column: span 7; }
  .cgrid > .card.seats { grid-column: span 5; }
  .cgrid > .card.charge { grid-column: span 5; }
  .cgrid > .card.cartiles { grid-column: span 7; }
  @media (max-width: 1100px) { .cgrid > .card, .cgrid > .card.climate, .cgrid > .card.seats, .cgrid > .card.charge, .cgrid > .card.cartiles { grid-column: span 12; } }
  .card { position: relative; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--shadow); overflow: hidden; }
  .card > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .card h2 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .card header .muted { font-size: 13px; }
  .card .sect { margin-top: 20px; }
  .card .sect > .lbl { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .card .sect > .lbl b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }

  .power { width: 52px; height: 52px; border-radius: 50%; padding: 0; display: grid; place-items: center; border: 1px solid var(--line); background: var(--raise); color: var(--muted); flex: none; transition: background .25s, color .25s, box-shadow .25s; }
  .power svg { width: 22px; height: 22px; }
  .power[aria-pressed="true"] { background: var(--heat); border-color: transparent; color: #fff; box-shadow: 0 6px 22px color-mix(in srgb, var(--heat) 45%, transparent); }
  .climate.cool .power[aria-pressed="true"] { background: var(--cool); box-shadow: 0 6px 22px color-mix(in srgb, var(--cool) 45%, transparent); }
  .power.pending { box-shadow: 0 0 0 3px var(--pending); }

  .climate::before { content: ""; position: absolute; inset: -40% -10% auto; height: 120%; background: radial-gradient(closest-side, color-mix(in srgb, var(--heat) 26%, transparent), transparent); opacity: 0; transition: opacity .6s; pointer-events: none; }
  .climate.cool::before { background: radial-gradient(closest-side, color-mix(in srgb, var(--cool) 24%, transparent), transparent); }
  .climate.on::before { opacity: 1; }
  .climate > * { position: relative; }
  .temp { display: flex; align-items: center; justify-content: center; gap: clamp(16px, 5vw, 40px); padding: 6px 0 4px; }
  .temp .tv { font-size: clamp(56px, 8vw, 76px); font-weight: 200; letter-spacing: -.04em; line-height: 1; min-width: 3.2ch; text-align: center; }
  .temp .tv small { font-size: .35em; font-weight: 300; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
  .temp .tv.pending { color: var(--pending); }
  .round { width: 48px; height: 48px; border-radius: 50%; padding: 0; font-size: 22px; line-height: 1; display: grid; place-items: center; background: var(--raise); border: 1px solid var(--line); }
  .round:active { transform: scale(.94); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border-radius: 99px; padding: 7px 14px; font-size: 13.5px; background: var(--raise); border: 1px solid transparent; color: var(--muted); }
  .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, var(--raise)); border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--text); }
  .chip.pending { border-color: var(--pending); color: var(--pending); }
  .chips.center { justify-content: center; }

  .seatmap { display: grid; gap: 10px; justify-content: center; }
  .seatmap .row { display: flex; gap: 10px; justify-content: center; }
  .seatmap .row.front { gap: 64px; }
  .seat { min-width: 84px; padding: 10px 6px 9px; border-radius: 16px; display: grid; justify-items: center; gap: 6px; background: var(--raise); border: 1px solid transparent; }
  .seat svg { width: 30px; height: 30px; color: var(--muted); transition: color .25s; }
  .seat .bars { display: flex; gap: 3px; }
  .seat .bars i { width: 12px; height: 4px; border-radius: 2px; background: var(--line); transition: background .25s; }
  .seat .bars i.on { background: var(--heat); }
  .seat.lit { background: color-mix(in srgb, var(--heat) 12%, var(--raise)); border-color: color-mix(in srgb, var(--heat) 35%, transparent); }
  .seat.lit svg { color: var(--heat); }
  .seat.pending { border-color: var(--pending); }
  .seat span { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper .v { font-size: 26px; font-weight: 300; min-width: 4ch; text-align: center; font-variant-numeric: tabular-nums; }
  .stepper .v small { font-size: 14px; color: var(--muted); margin-left: 2px; }
  .stepper .round { width: 40px; height: 40px; font-size: 19px; }

  .range { --p: 50%; -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; }
  .range::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--charge) var(--p), var(--raise) var(--p)); border: 1px solid var(--line); }
  .range::-moz-range-track { height: 10px; border-radius: 5px; background: var(--raise); border: 1px solid var(--line); }
  .range::-moz-range-progress { height: 10px; border-radius: 5px; background: var(--charge); }
  .range::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -9px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .range::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .range-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); margin-top: 2px; }
  .charge-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .charge-head .big { font-size: 34px; font-weight: 250; letter-spacing: -.03em; }
  .charge-head .big small { font-size: 16px; color: var(--muted); }
  .charge-head .state.on { color: var(--charge); }
  .cta { border-radius: 99px; padding: 10px 18px; font-weight: 500; white-space: nowrap; }
  .cta.go { background: var(--charge); border-color: transparent; color: #04140a; }
  .cta.stop { background: var(--raise); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .tile { display: grid; justify-items: center; align-content: start; gap: 7px; padding: 14px 8px 12px; border-radius: 16px; background: var(--raise); border: 1px solid transparent; text-align: center; min-height: 104px; }
  .tile .ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--text); transition: background .25s, color .25s; }
  .tile .ic svg { width: 21px; height: 21px; }
  .tile b { font-weight: 500; font-size: 13.5px; line-height: 1.2; }
  .tile small { font-size: 12px; color: var(--muted); line-height: 1.2; }
  .tile.on { background: color-mix(in srgb, var(--accent) 14%, var(--raise)); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .tile.on .ic { background: var(--accent); color: var(--accent-ink); }
  .tile.open { background: color-mix(in srgb, var(--warn) 14%, var(--raise)); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .tile.open .ic { background: var(--warn); color: #1b1305; }
  .tile.pending { border-color: var(--pending); }
  .tile.pending small { color: var(--pending); }
  .tile:active { transform: scale(.97); }
  .tiles.compact { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); margin-bottom: 28px; }
  .tiles.compact .tile { min-height: 0; padding: 12px 6px 10px; background: var(--surface); border-color: var(--line-soft); }
  .tiles.compact .tile .ic { background: var(--raise); }
  .tiles.compact .tile.on .ic { background: var(--accent); } .tiles.compact .tile.open .ic { background: var(--warn); }
  .tiles.compact .tile small { display: none; }
  @media (max-width: 520px) { .tiles, .tiles.compact { grid-template-columns: repeat(3, minmax(0, 1fr)); } .seat { min-width: 72px; } .seatmap .row.front { gap: 40px; } }

  /* ---------- tables ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-soft); margin-bottom: 16px; overflow-x: auto; }
  .tabs button { border: 0; background: none; border-radius: 0; padding: 9px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tablewrap { overflow: auto; max-height: 62vh; border: 1px solid var(--line-soft); border-radius: var(--r-md); background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 9px 12px; position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 1; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.code { font-family: var(--mono); font-size: 13px; }
  td.val { max-width: 360px; word-break: break-word; }
  .src { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .src.stream { color: var(--charge); border-color: color-mix(in srgb, var(--charge) 45%, transparent); }
  .src.optimistic { color: var(--pending); border-color: color-mix(in srgb, var(--pending) 50%, transparent); }
  .src.restored { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .src.bridge { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .age { color: var(--faint); white-space: nowrap; font-size: 13px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input[type=text] { min-width: 0; flex: 1 1 180px; max-width: 320px; }
  .toolbar .spacer { flex: 1; }
  pre { background: var(--raise); border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 12px; font: 12.5px/1.5 var(--mono); max-height: 420px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .flash { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }

  /* ---------- usage ---------- */
  .money { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 24px; margin-bottom: 18px; }
  .money .v { font-size: 30px; font-weight: 300; letter-spacing: -.02em; }
  .money .k { color: var(--muted); font-size: 13px; }
  .budget { position: relative; height: 10px; border-radius: 5px; background: var(--raise); border: 1px solid var(--line); }
  .budget i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--charge); }
  .budget b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); opacity: .65; }
  .bar { height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden; min-width: 60px; }
  .bar i { display: block; height: 100%; background: var(--accent); }

  /* ---------- settings ---------- */
  .presets { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .preset { text-align: left; padding: 12px 14px; flex: 1 1 190px; max-width: 300px; }
  .preset b { display: block; font-weight: 500; }
  .preset span { color: var(--muted); font-size: 13px; }
  details.fgroup { border-top: 1px solid var(--line-soft); }
  details.fgroup:first-child { border-top: 0; }
  details.fgroup > summary { list-style: none; cursor: pointer; padding: 14px 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  details.fgroup > summary::-webkit-details-marker { display: none; }
  details.fgroup > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; align-self: center; }
  details.fgroup[open] > summary::before { transform: rotate(45deg); }
  details.fgroup > summary b { font-size: 15px; font-weight: 600; }
  details.fgroup > summary span { color: var(--muted); font-size: 13px; }
  details.fgroup > summary .chg { color: var(--accent); }
  details.fgroup > div { padding-bottom: 10px; }
  .frow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 92px 42px; gap: 14px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line-soft); }
  .frow .name { min-width: 0; overflow-wrap: anywhere; }
  .frow .name small { display: block; color: var(--faint); font-family: var(--mono); font-size: 12px; }
  .frow .name .tag { font-size: 11px; color: var(--warn); margin-left: 6px; }
  .frow .name .chg { font-size: 11px; color: var(--accent); margin-left: 6px; }
  .frow .sig { text-align: right; color: var(--muted); font-size: 13px; }
  .frow select { width: 100%; }
  .frow.off .name, .frow.off .sig { opacity: .5; }
  .frow.head { border-top: 0; padding: 4px 0 6px; color: var(--faint); font-size: 12px; }
  .frow.head span:nth-child(3) { text-align: right; }
  @media (max-width: 560px) { .frow { grid-template-columns: minmax(0, 1fr) 96px 42px; gap: 10px; } .frow .sig, .frow.head { display: none; } .preset { max-width: none; } }
  .savebar { position: static; bottom: 16px; z-index: 10; margin-top: 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .savebar.dirty { position: sticky; border-color: var(--accent); }
  @media (max-width: 860px) { .savebar { bottom: 78px; padding: 12px 14px; gap: 8px; } .savebar .est { flex-basis: 100%; font-size: 13px; } .savebar .est b { font-size: 16px; } .savebar button { padding: 6px 10px; font-size: 13px; } .savebar.dirty #setReset { display: none; } }
  .savebar .est { flex: 1; min-width: 200px; font-size: 14px; }
  .savebar .est b { font-size: 18px; font-weight: 500; }
  .blecar + .blecar { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line-soft); }
  .blecar .state { display: flex; align-items: flex-start; gap: 8px; font-weight: 500; margin-bottom: 4px; }
  .blecar .state small { color: var(--muted); font-weight: 400; }
  .blecar .state .dot { margin-top: .45em; }
  .bleform { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; margin: 12px 0 8px; }
  .bleform label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  .bleform input { width: 100%; min-width: 0; }
  .blepair { background: var(--raise); border-radius: var(--r-sm); padding: 12px 14px; margin-top: 10px; font-size: 13px; }
  .blepair ol { margin: 6px 0 10px; padding-left: 20px; } .blepair li { margin: 3px 0; }
  @media (max-width: 720px) { .bleform { grid-template-columns: minmax(0, 1fr); } }
  .note-line { grid-column: 2 / -1; color: var(--muted); font-size: 12px; }
  .ver { font-size: 11.5px; color: var(--muted); display: grid; gap: 4px; padding: 0 4px; }
  .ver a { color: var(--accent, var(--charge)); font-weight: 600; text-decoration: none; font-size: 12.5px; }
  .ver a:hover { text-decoration: underline; }
  .views { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .view-opt { text-align: left; padding: 12px 14px; display: grid; gap: 2px; }
  .view-opt b { font-weight: 500; }
  .view-opt span { color: var(--muted); font-size: 13px; }
  .view-opt[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .view-opt:disabled { opacity: .5; }
  .credit { font-size: 12px; color: var(--faint); text-align: center; margin-top: 4px; }
  .credit a { color: inherit; }
  .btnlike { display: inline-block; background: var(--accent); color: var(--accent-ink); border-radius: var(--r-sm); padding: 7px 13px; font-size: 14px; font-weight: 500; }
  label:focus-within .btnlike { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--raise); border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: 14px; margin: 12px 0; }
  .note.bad { border-color: var(--danger); } .note.ok { border-color: var(--charge); }

  /* ---------- setup ---------- */
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  .steps li { display: grid; grid-template-columns: 30px 1fr auto; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line-soft); align-items: start; }
  .steps .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; border: 1px solid var(--line); color: var(--muted); }
  .steps li.done .n { background: var(--charge); border-color: var(--charge); color: #04130a; }
  .steps li.bad .n { background: var(--danger); border-color: var(--danger); color: #fff; }
  .steps .t { font-weight: 500; }
  .steps .d { color: var(--muted); font-size: 14px; margin-top: 2px; word-break: break-word; }
  .steps code { font-family: var(--mono); font-size: 12.5px; }
  .steps .a { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .qr { background: #fff; border-radius: var(--r-sm); padding: 6px; width: 140px; height: 140px; margin-top: 10px; }
  @media (max-width: 640px) { .steps li { grid-template-columns: 30px 1fr; } .steps .a { grid-column: 2; justify-content: flex-start; } }

  /* ---------- login ---------- */
  .login { max-width: 380px; margin: 14vh auto; padding: 28px; }
  .login h1 { font-size: 20px; margin: 0 0 6px; }
  .login input { width: 100%; margin: 14px 0 10px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: var(--r-md); font-size: 14px; max-width: calc(100% - 32px); }
  @media (max-width: 860px) { .toast { bottom: 84px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="panel login" id="login" hidden>
  <h1 data-t="login.title"></h1>
  <p class="muted small" data-t="login.text"></p>
  <form id="loginForm"><input type="password" id="loginToken" autocomplete="current-password" required><button class="primary" type="submit" data-t="login.button"></button></form>
</div>

<div class="shell" id="app" hidden>
  <nav class="side">
    <div class="brand"><b>Tesla Bridge</b><span id="carName"></span><select id="vinSelect" hidden></select></div>
    <div class="navlist" role="list">
      <a href="#overview" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 15.5 5.6 10a2 2 0 0 1 1.9-1.5h9a2 2 0 0 1 1.9 1.5l1.6 5.5M3.5 15.5h17v3h-17zM7 18.5V20M17 18.5V20"/></svg><span data-t="nav.overview"></span></a>
      <a href="#controls" data-view="controls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M5 17h14"/><circle cx="9" cy="7" r="2.2" fill="var(--bg)"/><circle cx="15" cy="17" r="2.2" fill="var(--bg)"/></svg><span data-t="nav.controls"></span></a>
      <a href="#data" data-view="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-t="nav.data"></span></a>
      <a href="#usage" data-view="usage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19V11M12 19V5M19 19v-6"/></svg><span data-t="nav.usage"></span></a>
      <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span data-t="nav.settings"></span></a>
      <a href="#setup" data-view="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12.5 9.5 17 19 7.5"/></svg><span data-t="nav.setup"></span><span class="count" id="setupCount" hidden></span></a>
    </div>
    <div class="conn">
      <div><span class="dot" id="dotLive"></span><span id="txtLive"></span></div>
      <div><span class="dot" id="dotMqtt"></span><span id="txtMqtt"></span></div>
      <div><span class="dot" id="dotCar"></span><span id="txtCar"></span></div>
    </div>
    <div class="prefs"><button id="btnLang" type="button"></button><button id="btnTheme" type="button"></button></div>
    <div class="ver"><span id="verText"></span><a id="verUpdate" target="_blank" rel="noopener" hidden></a></div>
  </nav>

  <div>
    <div class="mobile-top"><b id="mCar">Tesla Bridge</b><div class="conn-mini"><span class="dot" id="mDotLive"></span><span id="mTxtCar"></span></div></div>
    <main>
      <!-- ============ Overview ============ -->
      <section class="view" data-view="overview">
        <div class="hero">
          <div class="car">
            <div class="c3d" id="c3d" hidden>
              <div class="c3d-loading" data-t="car3d.loading"></div>
              <button type="button" class="palbtn" id="palBtn" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16a5 5 0 0 0 5-5c0-4.42-4.03-8-9-8zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg></button>
              <div class="cpick" id="cPick" hidden></div>
            </div>
            <svg viewBox="0 0 420 200" role="img" id="carSvg">
              <title id="carTitle"></title>
              <!-- top view, front to the right -->
              <g class="wheel"><rect x="84" y="12" width="50" height="16" rx="6"/><rect x="84" y="172" width="50" height="16" rx="6"/><rect x="292" y="12" width="50" height="16" rx="6"/><rect x="292" y="172" width="50" height="16" rx="6"/></g>
              <rect class="body" x="20" y="22" width="380" height="156" rx="64"/>
              <rect class="glass" id="g-windshield" x="268" y="44" width="40" height="112" rx="14"/>
              <rect class="glass" id="g-roof" x="150" y="44" width="112" height="112" rx="10"/>
              <rect class="glass" id="g-rear" x="102" y="50" width="40" height="100" rx="12"/>

              <rect class="glass" id="w-df" x="212" y="34" width="54" height="7" rx="3"/>
              <rect class="glass" id="w-dr" x="152" y="34" width="54" height="7" rx="3"/>
              <rect class="glass" id="w-pf" x="212" y="159" width="54" height="7" rx="3"/>
              <rect class="glass" id="w-pr" x="152" y="159" width="54" height="7" rx="3"/>
              <!-- doors, frunk, trunk -->
              <path class="part" id="d-df" d="M214 23 H 268"/>
              <path class="part" id="d-dr" d="M150 23 H 206"/>
              <path class="part" id="d-pf" d="M214 177 H 268"/>
              <path class="part" id="d-pr" d="M150 177 H 206"/>
              <path class="part" id="d-frunk" d="M340 34 Q 396 100 340 166"/>
              <path class="part" id="d-trunk" d="M78 34 Q 22 100 78 166"/>
              <circle class="port" id="d-port" cx="64" cy="40" r="6"/>
              <g class="lock-badge" id="lockBadge" transform="translate(206 100)">
                <circle r="19"/>
                <path id="lockShackle" d="M-6 -2 V-7 a6 6 0 0 1 12 0 V-2"/>
                <path d="M-8 -2 h16 v12 h-16 z"/>
              </g>
            </svg>
            <div class="car-legend" id="legend3d" hidden></div>
            <div class="credit" id="credit3d" hidden></div>
            <div class="car-legend" id="legendPlan"><span><i style="background:var(--warn)"></i><span data-t="car.open"></span></span><span><i style="background:var(--charge)"></i><span data-t="car.plugged"></span></span><span><i style="background:var(--pending)"></i><span data-t="car.pending"></span></span></div>
          </div>
          <div class="battery">
            <div class="pct num" id="bPct">–</div>
            <div class="range" id="bRange"></div>
            <div class="gauge" aria-hidden="true"><div class="fill" id="bFill"></div><div class="limit" id="bLimit" hidden></div></div>
            <div class="gauge-scale"><span>0</span><span id="bLimitTxt"></span><span>100 %</span></div>
            <div class="charge-line" id="bCharge"></div>
          </div>
        </div>

        <div class="tiles compact" id="quick"></div>
        <dl class="facts" id="facts"></dl>

        <div class="panel">
          <h2 data-t="log.title"></h2>
          <p class="sub" data-t="log.sub"></p>
          <ul class="log" id="cmdlog"></ul>
        </div>

      <!-- ============ Controls ============ -->

        <div class="cgrid" id="ctlGrid"></div>
      </section>

      <section class="view" data-view="data" hidden>

          <button role="tab" data-tab="fields" aria-selected="true" data-t="data.fields"></button>

          <button role="tab" data-tab="car" data-t="data.car"></button>

          <div class="toolbar"><input type="text" id="fieldFilter"><span class="spacer"></span><span class="muted small" id="fieldCount"></span></div>

      <!-- ============ Usage ============ -->
      <section class="view" data-view="usage" hidden>
        <h1 data-t="nav.usage"></h1>

        <div class="panel">
          <div class="money">
            <div><div class="v num" id="usTotal">–</div><div class="k" id="usMonth"></div></div>
            <div><div class="v num" id="usProj">–</div><div class="k" data-t="usage.proj"></div></div>
            <div><div class="v num" id="usLeft">–</div><div class="k" data-t="usage.left"></div></div>
          </div>
          <div class="budget"><i id="usBar"></i><b id="usMark" hidden></b></div>
          <p class="muted small" id="usHint"></p>
        </div>
        <div class="panel">
          <div class="tablewrap" style="border:0;max-height:none"><table><thead><tr><th data-t="th.category"></th><th style="text-align:right" data-t="th.count"></th><th data-t="th.rate"></th><th style="text-align:right" data-t="th.price"></th></tr></thead><tbody id="usCats"></tbody></table></div>
        </div>
        <div class="panel">
          <div class="tabs" role="tablist" id="usTabs">
            <button role="tab" data-tab="signals_by_field" aria-selected="true" data-t="usage.byfield"></button>
            <button role="tab" data-tab="commands_by_name" data-t="usage.commands"></button>
            <button role="tab" data-tab="data_by_name" data-t="usage.data"></button>
            <button role="tab" data-tab="ble_by_name" data-t="usage.ble"></button>
            <button role="tab" data-tab="history" data-t="usage.history"></button>

function ago(iso) {
  if (!iso) return "–";
  const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  if (s < 60) return t("ago.s", s);
  if (s < 3600) return t("ago.m", Math.floor(s / 60));
  if (s < 86400) return t("ago.h", Math.floor(s / 3600));
  return t("ago.d", Math.floor(s / 86400));
}
const clock = (iso) => new Date(iso).toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const nf = (n, d = 0) => Number(n).toLocaleString(locale(), { maximumFractionDigits: d, minimumFractionDigits: d });

function hm(hours) { if (hours == null) return "–"; const m = Math.round(hours * 60); return m >= 60 ? `${Math.floor(m / 60)} t ${m % 60} min`.replace(" t ", lang === "da" ? " t " : " h ") : `${m} min`; }

async function send(name, payload = "PRESS") {
  if (!vin) return;
  try {
    const r = await api(`/api/vehicles/${vin}/cmd/${name}`, { method: "POST", body: String(payload) });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      toast(t("err.cmd", name, err.error || r.status));
    }
  } catch (e) { if (e.message !== "unauthorized") toast(t("err.cmd", name, e.message)); }
}

  if (!b) return;
  if (b.dataset.confirm && !confirm(b.dataset.confirm === "1" ? t("confirm.unlock") : b.dataset.confirm)) return;
  send(b.dataset.cmd, b.dataset.p || "PRESS");
});

// ===================================================================== settings
let settings = null;          // from the server
const openGroups = new Set(["driving", "charging"]);
let draft = null;             // field -> {enabled, interval}
let draftSnapshot = null;
const INTERVALS = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 21600, 86400];
const SNAPSHOTS = [0, 15, 30, 60, 120, 360, 720, 1440];
function dur(sec) {
  if (sec < 60) return `${sec} s`;
  if (sec < 3600) return `${sec / 60} min`;
  const h = sec / 3600; return `${nf(h, h % 1 ? 1 : 0)} ${lang === "da" ? "t" : "h"}`;
}
async function loadSettings() {
  try { settings = await getJson("/api/settings"); } catch { return; }
  resetDraft();
}
function resetDraft() {
  draft = Object.fromEntries(settings.fields.map((f) => [f.field, { enabled: f.enabled, interval: f.interval }]));
  draftSnapshot = settings.snapshot_interval_minutes;
  renderSettings();
}
function changedFields() {
  return settings.fields.filter((f) => draft[f.field].enabled !== f.enabled || draft[f.field].interval !== f.interval);
}
function isDirty() { return settings && draft && (changedFields().length > 0 || draftSnapshot !== settings.snapshot_interval_minutes); }

/** Monthly signal cost now and with the draft, from this month's real signal counts. */
function estimate() {
  const start = new Date(settings.month_start), end = new Date(settings.month_end), now = new Date(settings.now);
  const elapsedDays = (now - start) / 86400000;
  if (elapsedDays < 0.25) return null;
  const factor = (end - start) / (now - start);
  let current = 0, next = 0, any = false;
  for (const f of settings.fields) {
    const monthly = f.signals_month * factor;
    if (f.signals_month > 0) any = true;
    current += monthly;
    const d = draft[f.field];
    if (!d.enabled) continue;
    if (!f.enabled) { next += f.continuous ? (86400 * 30) / d.interval * 0.05 : 0; continue; }   // re-enabled: rough guess
    next += f.continuous ? monthly * (f.interval / d.interval) : monthly;
  }
  if (!any) return null;
  return { current: current / settings.signals_per_dollar, next: next / settings.signals_per_dollar };
}

function renderSettings() {

    const costly = rows.filter((f) => f.continuous).length;
    const nChanged = rows.filter((f) => draft[f.field].enabled !== f.enabled || draft[f.field].interval !== f.interval).length;

    const open = openGroups.has(g) || !!q;
    return `<details class="fgroup" data-group="${g}" ${open ? "open" : ""}><summary><b>${esc(t("g." + g))}</b><span>${t("settings.groupInfo", rows.length, costly)}${off ? " · " + t("settings.groupOff", off) : ""}</span>${nChanged ? `<span class="chg">${t("settings.groupChanged", nChanged)}</span>` : ""}</summary><div>${rows.map((f) => {

      const opts = [...new Set([...INTERVALS, d.interval, f.default_interval])].sort((a, b) => a - b);
      return `<div class="frow ${d.enabled ? "" : "off"}" data-field="${f.field}">

        <select aria-label="${esc(name(f))}" ${d.enabled ? "" : "disabled"}>${opts.map((s) => `<option value="${s}" ${s === d.interval ? "selected" : ""}>${dur(s)}${s === f.default_interval ? " ★" : ""}</option>`).join("")}</select>
        <div class="sig num" title="${esc(t("settings.signals", nf(f.signals_month)))}">${f.signals_month ? nf(f.signals_month) : "–"}</div>
        <button type="button" class="switch" role="switch" aria-checked="${d.enabled}" aria-label="${esc(name(f))}"></button>
      </div>`;
    }).join("")}</div></details>`;
  }).join("");
  $("setGroups").innerHTML = html ? `<div class="frow head"><span></span><span>${t("settings.colInterval")}</span><span>${t("settings.colSignals")}</span><span>${t("settings.colOn")}</span></div>` + html : `<p class="empty">–</p>`;
  $("setSnapshot").innerHTML = [...new Set([...SNAPSHOTS, draftSnapshot])].sort((a, b) => a - b).map((m) =>
    `<option value="${m}" ${m === draftSnapshot ? "selected" : ""}>${m === 0 ? t("snap.off") : t("snap.every", dur(m * 60))}${m === settings.snapshot_default_minutes ? " ★" : ""}</option>`).join("");
  $("setSeatClimate").value = settings.climate_for_seat_heat === false ? "off" : "on";
  renderSaveBar();
}
function renderSaveBar() {

// ===================================================================== 3D model
let car3d = null, modelInfo = null;
const COLORS_KEY = "tb_car_colors";
let carColors = (() => { try { return JSON.parse(store.get(COLORS_KEY) || "null") || { paint: "white", interior: "black" }; } catch { return { paint: "white", interior: "black" }; } })();
const hsLabels = () => Object.fromEntries(["frunk", "trunk", "port", "fl", "fr", "rl", "rr"].map((k) => [k, t("hs." + k)]));
function car3dState() {
  const d = (k) => !!val(`door_${k}`);
  const doors = { fl: d("driver_front_open"), fr: d("passenger_front_open"), rl: d("driver_rear_open"), rr: d("passenger_rear_open") };
  const win = { fl: !!val("window_driver_front_open"), fr: !!val("window_passenger_front_open"), rl: !!val("window_driver_rear_open"), rr: !!val("window_passenger_rear_open") };
  const cs = val("charging_state"), temp = val("driver_temp_setting"), inside = val("inside_temp");
  return {
    doors,
    open: { frunk: !!val("frunk_open"), trunk: !!val("trunk_open"), port: !!val("charge_port_open"), fl: doors.fl || win.fl, fr: doors.fr || win.fr, rl: doors.rl || win.rl, rr: doors.rr || win.rr },
    windows: win,
    charging: cs === "charging" || cs === "starting",
    speed: val("speed") || 0, reverse: val("gear") === "R",
    climate: val("climate_on") ? ((temp ?? 21) >= (inside ?? 20) ? "heat" : "cool") : null,
  };
}
function update3d() {
  if (!car3d) return;
  const st = car3dState();
  car3d.update(st);
  const open = [];
  if (st.open.frunk) open.push(t("hs.frunk")); if (st.open.trunk) open.push(t("hs.trunk")); if (st.open.port) open.push(t("hs.port"));
  for (const k of ["fl", "fr", "rl", "rr"]) {
    if (st.doors[k]) open.push(`${t("hs." + k)} ${t("door")}`);
    else if (st.windows[k]) open.push(`${t("hs." + k)} ${t("window")}`);
  }
  $("legend3d").textContent = open.length ? t("car3d.open", open.join(", ")) : t("car3d.allClosed");
  const labels = hsLabels();
  for (const k of ["fl", "fr", "rl", "rr"]) labels[k] = `${t("hs." + k)} ${st.doors[k] ? t("door") : t("window")}`;
  car3d.setLabels(labels);
}
function renderPicker() {
  const sw = (attr, key, list, labelOf) => list.map(([k, c]) => `<button type="button" class="sw" data-${attr}="${k}" style="background:${c}" title="${esc(labelOf(k))}" aria-label="${esc(labelOf(k))}" aria-pressed="${carColors[key] === k}"></button>`).join("");
  $("cPick").innerHTML = `<div><div class="lbl">${t("car3d.paint")}</div><div class="sws">${sw("paint", "paint", window.__PAINTS || [], (k) => t("paint." + k))}</div></div>
    <div><div class="lbl">${t("car3d.interior")}</div><div class="sws">${sw("int", "interior", window.__INTERIORS || [], (k) => t("paint." + k))}</div></div>`;
  $("palBtn").setAttribute("aria-label", t("car3d.colors"));
}
$("palBtn").onclick = () => { const c = $("cPick"); c.hidden = !c.hidden; $("palBtn").setAttribute("aria-expanded", String(!c.hidden)); };
$("cPick").addEventListener("click", (e) => {
  const p = e.target.closest("[data-paint]"), i = e.target.closest("[data-int]");
  if (!p && !i) return;
  if (p) carColors.paint = p.dataset.paint; if (i) carColors.interior = i.dataset.int;
  store.set(COLORS_KEY, JSON.stringify(carColors)); car3d?.setColors(carColors); renderPicker();
});
function onHotspot(id) {
  if (id === "frunk") { if (val("frunk_open")) return toast(t("frunkManual")); if (confirm(t("confirm.frunk"))) send("frunk", "OPEN"); }
  else if (id === "trunk") { if (val("trunk_open")) send("trunk", "CLOSE"); else if (confirm(t("confirm.trunkOpen"))) send("trunk", "OPEN"); }
  else if (id === "port") send("charge_port_door", val("charge_port_open") ? "CLOSE" : "OPEN");
}
function showPlan(on) {
  $("carSvg").style.display = on ? "" : "none"; $("legendPlan").hidden = !on;
  $("c3d").hidden = on; $("legend3d").hidden = on;
  document.querySelector(".hero").classList.toggle("has3d", !on);
}
async function loadModel() {
  try { modelInfo = await getJson("/api/car-model/info"); } catch { modelInfo = null; }
  renderModelStatus();
  if (car3d) { car3d.dispose(); car3d = null; $("c3d").classList.remove("ready"); }
  const m = modelInfo;
  // the chosen view, falling back when its model is missing
  let src = null;
  if (m && m.view === "custom" && m.present) src = "/api/car-model";
  else if (m && m.view !== "drawing" && m.builtin) src = "/api/car-model/builtin";
  const builtin = src === "/api/car-model/builtin";
  $("credit3d").hidden = !builtin;
  if (builtin && m.builtin_credit) { const c = m.builtin_credit; $("credit3d").innerHTML = t("credit", esc(c.url), esc(c.title), esc(c.author), esc(c.license_url), esc(c.license)); }
  if (!src || !window.WebGLRenderingContext) { showPlan(true); return; }
  showPlan(false);
  try {
    const [buf, mod] = await Promise.all([(await api(src)).arrayBuffer(), import("./car3d.js")]);
    window.__PAINTS = mod.PAINTS.map(([k, c]) => [k, c]); window.__INTERIORS = mod.INTERIORS;
    car3d = await mod.mount($("c3d"), buf, { labels: hsLabels(), onHotspot });
    car3d.setColors(carColors); renderPicker(); update3d();
  } catch (e) {
    console.warn("3D model could not be shown, falling back to the drawing", e);
    showPlan(true); $("credit3d").hidden = true;
  }
}
function renderModelStatus() {
  const m = modelInfo;
  if (!m) return;
  const opts = [["builtin", m.builtin], ["custom", m.present], ["drawing", true]];
  $("carViews").innerHTML = opts.map(([v, ok]) =>
    `<button type="button" class="view-opt" role="radio" aria-checked="${m.view === v}" data-view-opt="${v}" ${ok || v === "custom" ? "" : "disabled"}><b>${t("view." + v)}</b><span>${v === "custom" && !ok ? t("view.noCustom") : t("view." + v + "Sub")}</span></button>`).join("");
  $("modelStatus").textContent = m.present
    ? t("model.has", m.source === "uploaded" ? t("model.srcUploaded") : m.file, nf(m.size / 1048576, 1), new Date(m.updated_at).toLocaleDateString(locale()))
    : "";
  $("modelStatus").hidden = !m.present;
  $("modelRemove").hidden = !(m.present && m.source === "uploaded");
  document.querySelector("#modelPick .btnlike").textContent = m.present ? t("model.replace") : t("model.upload");
}
async function setCarView(view) {
  await api("/api/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ car_view: view, push: false }) });
  await loadModel();
}
$("carViews").addEventListener("click", (e) => {
  const b = e.target.closest("[data-view-opt]"); if (!b || b.disabled) return;
  if (b.dataset.viewOpt === "custom" && !modelInfo?.present) { $("modelFile").click(); return; }
  setCarView(b.dataset.viewOpt);
});
$("modelFile").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const lbl = document.querySelector("#modelPick .btnlike"); lbl.textContent = t("model.uploading");
  try {
    const r = await api("/api/car-model", { method: "POST", headers: { "Content-Type": "model/gltf-binary" }, body: f });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { toast(j.error || String(r.status)); return; }
    toast(t("model.uploaded"));
    e.target.value = ""; await setCarView("custom"); return;
  } finally { e.target.value = ""; }
  await loadModel();
};
$("modelRemove").onclick = async () => {
  if (!confirm(t("confirm.removeModel"))) return;
  await api("/api/car-model", { method: "DELETE" });
  if (modelInfo?.view === "custom") await setCarView("builtin"); else await loadModel();
};

// ===================================================================== live
function setLive(ok) {
  for (const id of ["dotLive", "mDotLive"]) $(id).className = "dot " + (ok ? "ok" : "bad");
  $("txtLive").textContent = ok ? t("live.on") : t("live.off");
}
function setMqtt(i) {
  $("dotMqtt").className = "dot " + (i.mqtt_connected ? "ok" : "bad");
  $("txtMqtt").textContent = i.embedded_broker ? t("mqtt.embedded") : t("mqtt");
}
let renderQueued = false, lastChanged = null;
function scheduleRender(key) {
  lastChanged = key;
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    renderOverview();
    if (!$("ctlGrid").closest(".view").hidden && !sliding) renderControls();
    if (!document.querySelector('[data-pane="fields"]').closest(".view").hidden) renderFields(lastChanged);
  });
}
function connectEvents() {
  const es = new EventSource("/api/events" + (token ? `?token=${encodeURIComponent(token)}` : ""));
  es.onopen = () => setLive(true);
  es.onerror = () => setLive(false);
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.vin && vin && e.vin.toUpperCase() !== vin.toUpperCase()) return;
    if (e.type === "field") {
      if (e.data.value === undefined && !e.data.source) fields.delete(e.data.key);
      else fields.set(e.data.key, { value: e.data.value, updated_at: e.data.updated_at, source: e.data.source });
      scheduleRender(e.data.key);
    } else if (e.type === "command") addCommand(e);
    else addRaw(e);
  };
}

function renderAll() {
  if (car3d) { car3d.setLabels(hsLabels()); renderPicker(); }
  renderModelStatus();
  renderOverview(); renderControls(); renderFields(); renderRaw(); renderLog(); renderUsage(); renderSettings(); renderBle(); renderVersion();
  if (info) { setMqtt(info); $("cfgHint").textContent = t("data.cfgHint", info.telemetry_hostname ? `${info.telemetry_hostname}:${info.telemetry_port}` : "–"); }
  route();
}

async function init() {
  applyTheme(); applyStatic();
  info = await getJson("/api/info");
  if (info.auth_required && !token) { showLogin(); return; }
  cars = await getJson("/api/state");
  $("login").hidden = true; $("app").hidden = false;
  $("btnSim").hidden = !info.simulator;
  const sel = $("vinSelect");
  sel.innerHTML = cars.map((c) => `<option value="${esc(c.vin)}">${esc(c.name)}</option>`).join("");
  sel.hidden = cars.length < 2;
  const pick = (v) => {
    vin = v; fields.clear();
    Object.entries(cars.find((c) => c.vin === v)?.fields || {}).forEach(([k, f]) => fields.set(k, f));
    renderAll();
  };
  sel.onchange = () => pick(sel.value);
  if (cars.length) pick(cars[0].vin); else renderAll();
  (await getJson("/api/events/recent")).forEach((e) => (e.type === "command" ? cmdLog.push(e) : rawRows.push(e)));
  cmdLog.reverse(); rawRows.reverse(); renderLog(); renderRaw();
  connectEvents();
  loadSetup(false);
  loadModel();
  loadSettings().then(renderControls);   // the seat card's hint depends on a setting
  loadUpdate();
}

setInterval(() => {
  document.querySelectorAll("td.age[data-at]").forEach((td) => (td.textContent = ago(td.dataset.at)));
  if (!document.querySelector('.view[data-view="overview"]').hidden) renderOverview();
}, 5000);
setInterval(async () => { try { info = await getJson("/api/info"); setMqtt(info); } catch {} }, 15000);

// ===================================================================== version
let update = null;
async function loadUpdate() {
  try { update = await getJson("/api/update"); } catch { return; }
  renderVersion();
}
function renderVersion() {
  const ver = "Tesla Bridge v" + (update?.installed_display || info?.version_display || info?.version || "?");
  $("setupVer").innerHTML = esc(ver) + (update?.update_available ? ` · <a href="${esc(update.release_url || "https://github.com/Mfoldager17/tesla-bridge/releases")}" target="_blank" rel="noopener">${esc(t("ver.update", update.latest_version))}</a> – <code>docker compose pull && docker compose up -d</code>` : "");
  $("verText").textContent = "v" + (update?.installed_display || info?.version_display || info?.version || "?");
  const a = $("verUpdate");
  a.hidden = !update?.update_available;
  if (update?.update_available) {
    a.textContent = t("ver.update", update.latest_version);
    a.href = update.release_url || "https://github.com/Mfoldager17/tesla-bridge/releases";
    a.title = t("ver.how");
  }
}
setInterval(loadUpdate, 3 * 3600 * 1000);
setInterval(() => { if (location.hash === "#usage") loadUsage(); }, 30000);

init().catch((e) => { if (e.message !== "unauthorized") { $("app").hidden = false; setLive(false); $("txtLive").textContent = e.message; } });
})();
</script>
</body>
</html>
