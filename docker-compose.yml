# Tesla Bridge – selvhostet erstatning for Teslemetry
#
#   https://<dit domæne> (NPM :443) ──▶ tesla-bridge :8091   (offentlig nøgle + login-callback)
#
#   Bil ──mTLS:4443──▶ fleet-telemetry ──MQTT──▶ mosquitto ◀──▶ tesla-bridge ◀──▶ HA / paneler
#                                                                    │
#                                            tesla-proxy (signerer) ◀┘──▶ Tesla Fleet API
#
# Kun port 4443 skal port-forwardes fra routeren (til fleet-telemetry).
#
# MQTT: bruger som standard din eksisterende broker (fx Mosquitto på Pi'en til Z2M).
#   Sæt Bridge__Mqtt__Host (+ kodeord) i .env – config/fleet-telemetry/config.json laves ud fra den.
# Har du ingen broker:  docker compose --profile mosquitto up -d

services:
  mosquitto:                   # valgfri – kun med --profile mosquitto
    image: eclipse-mosquitto:2
    profiles: ["mosquitto"]
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data

  fleet-telemetry:
    image: tesla/fleet-telemetry:v0.9.5
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"   # som din bruger, så den kan læse privkey.pem (chmod 600)
    ports:
      - "4443:4443"            # port forward fra routeren hertil
    environment:
      SUPPRESS_TLS_HANDSHAKE_ERROR_LOGGING: "true"
    volumes:
      - ./config/fleet-telemetry/config.json:/etc/fleet-telemetry/config.json:ro   # laves af scripts/render-config.sh
      # fullchain.pem + privkey.pem for dit telemetri-domæne (fx kopieret/symlinket fra NPM's letsencrypt-mappe)
      - ./config/fleet-telemetry/certs:/etc/fleet-telemetry/certs:ro

  tesla-proxy:
    image: tesla/vehicle-command:v0.4.1
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"   # som din bruger, så den kan læse fleet-key.pem (chmod 600)
    # Ingen ports: kun bridgen taler med den på det interne docker-netværk.
    environment:
      TESLA_HTTP_PROXY_TLS_CERT: /config/tls-cert.pem
      TESLA_HTTP_PROXY_TLS_KEY: /config/tls-key.pem
      TESLA_HTTP_PROXY_HOST: 0.0.0.0
      TESLA_HTTP_PROXY_PORT: "4443"
      TESLA_HTTP_PROXY_TIMEOUT: 30s
      TESLA_KEY_FILE: /config/fleet-key.pem   # din apps private partnernøgle (samme som public key på .well-known)
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config/tesla-proxy:/config:ro

  tesla-bridge:
    # Færdigbygget af GitHub Actions. Byg selv i stedet:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/mfoldager17/tesla-bridge:${BRIDGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "8090:8080"            # dashboard på http://<pi>:8090 (8080 bruges ofte af Z2M). Kun LAN – port-forward IKKE.
      - "8091:8091"            # offentlig lytter: KUN /.well-known/…public-key.pem og /auth/callback.
                               # NPM sender https://<dit domæne> hertil. Port-forward IKKE direkte.
    volumes:
      - ./config/bridge:/config/bridge:ro
      - ./config/tesla-proxy/tls-cert.pem:/config/tesla-proxy/tls-cert.pem:ro
      - ./config/tesla-proxy/fleet-key.pem:/config/tesla-proxy/fleet-key.pem:ro   # kun for at vise den offentlige nøgle
      - ./data:/data
    depends_on:
      - tesla-proxy

volumes:
  mosquitto-data:
