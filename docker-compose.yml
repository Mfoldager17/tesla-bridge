# Tesla Bridge – selvhostet erstatning for Teslemetry
#
# Serveren skal KUN have denne fil + .env (ingen kildekode):
#   curl -fsSLO https://raw.githubusercontent.com/Mfoldager17/tesla-bridge/main/docker-compose.yml
#   curl -fsSL  https://raw.githubusercontent.com/Mfoldager17/tesla-bridge/main/.env.example -o .env
#   nano .env && docker compose up -d
# Opdatering:  docker compose pull && docker compose up -d
#
#   https://<dit domæne> (NPM :443) ──▶ tesla-bridge :8091   (offentlig nøgle + login-callback)
#   Bil ──mTLS:4443──▶ fleet-telemetry ──MQTT──▶ din broker ◀──▶ tesla-bridge ◀──▶ HA / paneler
#                                                                    │
#                                            tesla-proxy (signerer) ◀┘──▶ Tesla Fleet API
#
# Kun port 4443 skal port-forwardes fra routeren (til fleet-telemetry).
# Mapperne ./config og ./data laves automatisk. Det eneste du selv lægger ind er
# certifikatet til dit domæne i ./config/fleet-telemetry/certs/ (fullchain.pem + privkey.pem).

x-bridge-image: &bridge-image ghcr.io/mfoldager17/tesla-bridge:${BRIDGE_TAG:-latest}

services:
  # Kører én gang ved hver start og stopper igen: laver appens nøgle og intern TLS, hvis de mangler,
  # skriver fleet-telemetrys config.json ud fra .env og giver filerne til PUID:PGID.
  tesla-init:
    image: *bridge-image
    command: ["init"]
    env_file: .env
    restart: "no"
    volumes:
      - ./config:/config
      - ./data:/data

  fleet-telemetry:
    image: tesla/fleet-telemetry:v0.9.5
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "4443:4443"            # port forward fra routeren hertil
    environment:
      SUPPRESS_TLS_HANDSHAKE_ERROR_LOGGING: "true"
    volumes:
      - ./config/fleet-telemetry/config.json:/etc/fleet-telemetry/config.json:ro
      - ./config/fleet-telemetry/certs:/etc/fleet-telemetry/certs:ro
    depends_on:
      tesla-init:
        condition: service_completed_successfully

  tesla-proxy:
    image: tesla/vehicle-command:0.4.1
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    # Ingen ports: kun bridgen taler med den på det interne docker-netværk.
    environment:
      TESLA_HTTP_PROXY_TLS_CERT: /config/tls-cert.pem
      TESLA_HTTP_PROXY_TLS_KEY: /config/tls-key.pem
      TESLA_HTTP_PROXY_HOST: 0.0.0.0
      TESLA_HTTP_PROXY_PORT: "4443"
      TESLA_HTTP_PROXY_TIMEOUT: 30s
      TESLA_KEY_FILE: /config/fleet-key.pem   # appens private nøgle
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config/tesla-proxy:/config:ro
    depends_on:
      tesla-init:
        condition: service_completed_successfully

  tesla-bridge:
    image: *bridge-image
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      HOME: /data
    ports:
      - "8090:8080"            # dashboard på http://<server>:8090. Kun LAN – port-forward IKKE.
      - "8091:8091"            # offentlig: KUN nøgle + login-callback. NPM sender https://<dit domæne> hertil.
    volumes:
      - ./config:/config
      - ./data:/data
    depends_on:
      tesla-init:
        condition: service_completed_successfully
      tesla-proxy:
        condition: service_started
