# Tesla Bridge – self-hosted replacement for Teslemetry
#
# The server ONLY needs this file + .env (no source code):
#   curl -fsSLO https://raw.githubusercontent.com/Mfoldager17/tesla-bridge/main/docker-compose.yml
#   curl -fsSL  https://raw.githubusercontent.com/Mfoldager17/tesla-bridge/main/.env.example -o .env
#   nano .env && docker compose up -d
# Update:  docker compose pull && docker compose up -d
#
#   https://<your domain> (reverse proxy :443 or a tunnel) ──▶ tesla-bridge :8091   (public key + login callback)
#   Car ──mTLS:4443──▶ fleet-telemetry ──MQTT──▶ your broker ◀──▶ tesla-bridge ◀──▶ Home Assistant / panels
#                      (or the bridge's embedded broker: Bridge__Mqtt__EmbeddedBroker=true – no Mosquitto needed)
#                                                                      │
#                                              tesla-proxy (signs) ◀───┘──▶ Tesla Fleet API
#
# Port 4443 must be forwarded from your router (to fleet-telemetry) – it can't go through a proxy or tunnel.
# ./config and ./data are created automatically. The only thing you add yourself is a certificate for the
# name the car connects to, in ./config/fleet-telemetry/certs/ (fullchain.pem + privkey.pem). Any
# Let's Encrypt certificate works – Nginx Proxy Manager is not required.

x-bridge-image: &bridge-image ghcr.io/mfoldager17/tesla-bridge:${BRIDGE_TAG:-latest}

# Docker keeps container logs forever by default – cap them so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Runs once on every start and exits: creates the app key and internal TLS if missing,
  # writes fleet-telemetry's config.json from .env and hands the files to PUID:PGID.
  tesla-init:
    logging: *logging
    image: *bridge-image
    command: ["init"]
    env_file: .env
    restart: "no"
    volumes:
      - ./config:/config
      - ./data:/data

  fleet-telemetry:
    logging: *logging
    image: tesla/fleet-telemetry:v0.9.5
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "4443:4443"            # forward this port from your router
    environment:
      SUPPRESS_TLS_HANDSHAKE_ERROR_LOGGING: "true"
    volumes:
      - ./config/fleet-telemetry/config.json:/etc/fleet-telemetry/config.json:ro
      - ./config/fleet-telemetry/certs:/etc/fleet-telemetry/certs:ro
    depends_on:
      tesla-init:
        condition: service_completed_successfully
      tesla-bridge:
        condition: service_started   # with the embedded broker the bridge must be running first

  tesla-proxy:
    logging: *logging
    image: tesla/vehicle-command:0.4.1
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    # No ports: only the bridge talks to it, on the internal docker network.
    environment:
      TESLA_HTTP_PROXY_TLS_CERT: /config/tls-cert.pem
      TESLA_HTTP_PROXY_TLS_KEY: /config/tls-key.pem
      TESLA_HTTP_PROXY_HOST: 0.0.0.0
      TESLA_HTTP_PROXY_PORT: "4443"
      TESLA_HTTP_PROXY_TIMEOUT: 30s
      TESLA_KEY_FILE: /config/fleet-key.pem   # the app's private key
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config/tesla-proxy:/config:ro
    depends_on:
      tesla-init:
        condition: service_completed_successfully

  tesla-bridge:
    logging: *logging
    image: *bridge-image
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      HOME: /data
    ports:
      - "8090:8080"            # dashboard + API on http://<server>:8090. LAN only – do NOT forward this port.
      - "8091:8091"            # public: ONLY public key + login callback. Your reverse proxy sends https://<your domain> here.
      # - "1884:1883"          # only if others (e.g. HA) should use the embedded broker – otherwise keep it closed
    volumes:
      - ./config:/config
      - ./data:/data
    depends_on:
      tesla-init:
        condition: service_completed_successfully
      tesla-proxy:
        condition: service_started
